# ---------------------------------------------------------------------------
# Boris Brejcha · Pedregal · 09 Oct 2026 — gig-specific layout.
#
# Built by tools/build_boris.py into build/boris-landscape.tosc, next to the
# generic PlanB-FX layout (spec/mapping.yaml), which it does not touch.
#
# Three pages: SHOW (Resolume), FX (Resolume effects) and TD. Every control
# carries a real name, and anything this show does not use is left out rather
# than kept spare.
# ---------------------------------------------------------------------------

layout:
  width: 1180            # iPad Air 4, landscape, in points
  height: 820
  tabbar_height: 60

# Unchanged from the generic layout. The slot is what the builder uses; host
# and port are for setting up the iPad.
connections:
  resolume:      {slot: 1, host: 192.168.20.231, port: 7000, receive: 9000}
  touchdesigner: {slot: 2, host: 192.168.20.231, port: 7001, receive: 9001}

colors:
  bg:        [0.11, 0.11, 0.13, 1.0]
  panel:     [0.16, 0.16, 0.19, 1.0]
  text:      [0.92, 0.92, 0.94, 1.0]
  unlit:     [0.22, 0.22, 0.25, 1.0]     # a toggle that is off
  # Carried over from the generic layout, per the brief.
  resolume:  [0.93, 0.35, 0.16, 1.0]
  danger:    [0.85, 0.15, 0.25, 1.0]
  master:    [0.96, 0.96, 0.98, 1.0]
  accent:    [0.95, 0.80, 0.20, 1.0]
  # One colour per part of the TD rig.
  # Off the brief's purple/green on request: Andrés picked blue and yellow.
  # The yellow leans lemon so it stays apart from Boris's orange.
  spiderweb: [0.28, 0.55, 0.95, 1.0]     # blue
  side:      [0.98, 0.88, 0.22, 1.0]     # yellow
  boris:     [1.00, 0.71, 0.28, 1.0]

# FX dials repaint themselves by value between these stops, as in the
# generic layout: cool at rest, warming to green at full.
fx_scale:
  low:  [0.11, 0.28, 0.72, 1.0]
  mid:  [0.10, 0.78, 0.82, 1.0]
  high: [0.25, 0.95, 0.38, 1.0]

# Toggle captions are on_text/off_text, never bare on:/off: -- YAML reads an
# unquoted `on` or `off` key as the boolean true/false.

# ---------------------------------------------------------------------------
# Page 1 · SHOW (Resolume)
# ---------------------------------------------------------------------------
show:
  # Banked as on the generic layout: the first tab row picks a group, the
  # second a bank within it, and < > step through banks in order. Each bank
  # shows its own column buttons over its clips, so the column row follows
  # the bank (no fixed scenes row). 9 x 4 x 4 covers the 127 columns; the
  # last bank shows only 127 and nothing past it is built.
  columns_total: 127     # columns in the composition
  clips: 9               # columns and clips per bank
  banks: 4               # banks per group (second tab row)
  bank_groups: 4         # groups (first tab row): 1-36, 37-72, 73-108, 109-127
  # Top to bottom as Resolume draws them: layer 1 sits at the bottom.
  layers:
    - {layer: 5, name: MIRROR L/R}
    - {layer: 4, name: DJ BOOTH}
    # Feeds the LED strips. Its Bypass must stay ON in Resolume, which keeps
    # it off the main canvas, so this row never gets a bypass button. It has
    # its own clips and PREV/NEXT, but no CLEAR: blanking the strips mid-show
    # is one tap too easy.
    - {layer: 3, name: SIDE AUDIOS, no_clear: true, note: "LED · bypass stays ON"}
    - {layer: 2, name: CIRCULO CENTRAL}
    - {layer: 1, name: PANORAMA}

  addresses:
    clip_connect:   /composition/layers/{layer}/clips/{clip}/connect
    # Clip names (a string). Resolume pushes one when it changes; the iPad
    # asks for a bank's names by sending "?" here whenever that bank shows.
    clip_name:      /composition/layers/{layer}/clips/{clip}/name
    column_connect: /composition/columns/{column}/connect
    layer_opacity:  /composition/layers/{layer}/video/opacity
    layer_clear:    /composition/layers/{layer}/clear
    clip_next:      /composition/layers/{layer}/connectnextclip       # unverified
    clip_prev:      /composition/layers/{layer}/connectpreviousclip   # unverified
    # A = Panorama on the left, B = Mirror L/R on the right.
    crossfader:     /composition/crossfader/phase
    master:         /composition/master
    tempo_tap:      /composition/tempocontroller/tempotap
    tempo_resync:   /composition/tempocontroller/resync

  # Tempo halve / double, as on the APC40's arrows. They replace the speed
  # fader: every clip is in BPM sync, so composition speed does nothing and
  # the tempo is what moves playback. Each sends 1 on press.
  tempo_double: /composition/tempocontroller/tempo/multiply   # APC up
  tempo_halve:  /composition/tempocontroller/tempo/divide     # APC down

  # Rotates the hue of the whole Resolume output (needs a Hue Rotate effect
  # in the composition's chain). Address confirmed in Arena's Edit OSC: the
  # parameter is named huerotate, not rotation.
  hue_rotate:
    label: "HUE ROTATE · Resolume"
    address: /composition/video/effects/huerotate/effect/huerotate
    # Also sent, same value, to Side Audios (layer 3): the LED strips read
    # that layer directly, so composition effects never reach them.
    # Send only: the composition is what the fader shows.
    also: [/composition/layers/3/video/effects/huerotate/effect/huerotate]

  # RGB delay on the whole Resolume output: the Delay RGB effect's opacity,
  # 0 = off, 1 = full. Confirmed in Arena's Edit OSC (the effect is
  # delayrgb, and opacity has no effect/ in its path).
  rgb_delay:
    label: "RGB DELAY · Resolume"
    address: /composition/video/effects/delayrgb/opacity

  # Desaturates the whole Resolume output, TD clips included -- so it stacks
  # with TD's own saturation. Needs a Saturation effect in the composition's
  # chain (Arena: Composition -> drop Saturation in -> save).
  saturation:
    label: "SATURATION · Resolume"
    # UNVERIFIED: confirm in Arena with Shortcuts -> Edit OSC.
    address: /composition/video/effects/saturation/effect/saturation
    # Also sent to Side Audios (layer 3), same value and range, for the LED
    # strips, which read that layer directly. Send only.
    also: [/composition/layers/3/video/effects/saturation/effect/saturation]
    # The value sent at the fader's top, which must be the effect's normal
    # colour. If Arena's range runs past normal (e.g. 0-3 with normal at 1,
    # i.e. 0.333 normalised), set `top` to normal's normalised value so full
    # right is normal colour, not oversaturated. Bottom is always 0 = B&W.
    top: 1.0

# ---------------------------------------------------------------------------
# Page 2 · FX (Resolume effects)
#
# Layers down, effects across, drag-only dials, as on the generic FX page.
# Each effect must already sit in that layer's chain in Arena. The
# composition's hue rotate, RGB delay and saturation are SHOW page faders,
# so this page is layers only.
# ---------------------------------------------------------------------------
fx:
  # {param} is the path after the effect name: usually effect/<name>, but
  # Delay RGB's amount is the effect's own opacity, with no effect/ part.
  layer_param: /composition/layers/{layer}/video/effects/{fx}/{param}
  effects:
    # Confirmed in Arena's Edit OSC on the composition; the layer versions
    # follow the same pattern.
    - {name: HUE,       fx: huerotate,  param: effect/huerotate}
    - {name: SAT,       fx: saturation, param: effect/saturation}

# ---------------------------------------------------------------------------
# Page 3 · TD (TouchDesigner)
#
# Addresses are exactly the ones TD already routes on. Only labels, grouping
# and look are new -- plus /td/toggle/5 and the four colour-strip addresses,
# wired on the TD side. /td/toggle/4 (Panorama / wide) is retired: it changed the Spiderweb
# resolution live, so it is on no page at all.
# Every control here sends AND receives on its address, so the iPad follows
# the APC40 and the computer.
# ---------------------------------------------------------------------------
td:
  spiderweb:
    label: SPIDERWEB
    faders:
      - {label: ZOOM,        address: /td/fader/1}   # inverted in TD
      - {label: NOISE SPEED, address: /td/fader/2}   # inverted in TD
      - {label: RGB DELAY,   address: /td/fader/3}
      - {label: INTENSITY,   address: /td/intensity}
    pad: {label: CAMERA ORBIT, x: /td/pad/2/x, y: /td/pad/2/y}

  side:
    label: SIDE AUDIOS
    faders:
      # Treble on the left, bass on the right: positions swapped on
      # request, addresses unchanged (TD routes on them).
      - {label: TREBLE,      address: /td/fader/6}
      - {label: MID,         address: /td/fader/5}
      - {label: BASS,        address: /td/fader/4}
      - {label: BRIGHTNESS,  address: /td/fader/7}
      - {label: PEAK HEIGHT, address: /td/fader/8}
    toggle:
      address: /td/toggle/5
      on_text:  AUTO HEIGHT ON
      off_text: AUTO HEIGHT OFF
    # Momentary, each sending 1 on press; the last one pressed stays lit.
    palettes:
      - {name: JOKER,        address: /td/trigger/1}
      - {name: RED LASER,    address: /td/trigger/2}
      - {name: ULTRAVIOLET,  address: /td/trigger/3}
      - {name: GOLD MASK,    address: /td/trigger/4}
      - {name: TOXIC,        address: /td/trigger/5}
      - {name: MINIMAL MONO, address: /td/trigger/6}
      - {name: RGB DEBUG,    address: /td/trigger/7}

  boris:
    label: BORIS
    toggles:
      # OFF is the panic state (hides every tag), so it is shown in danger red.
      # It starts ON -- the normal running state -- rather than loading as a
      # red PANIC before TD has reported anything; TD's feedback corrects it.
      - {address: /td/toggle/1, on_text: LABELS ON, off_text: "LABELS OFF · PANIC",
         off_color: danger, size: large, start_on: true}
      # TD switches this on by itself when it recognises his face.
      - {address: /td/toggle/2, on_text: BORIS LOCKED, off_text: BORIS LOCK}
      - {address: /td/toggle/3, on_text: PIRATE TAGS ON, off_text: PIRATE TAGS OFF}

  # COLOUR strip at the foot, in two halves side by side, each a hue fader
  # over a saturation fader. The Boris detection frame follows the Side
  # Audios colour, so it shares the right half. /td/scene (kept only for APC
  # track fader 8, which moves both hues) and /td/saturation (retired) are
  # deliberately on no page.
  colour:
    - label: SPIDERWEB
      color: spiderweb
      hue:        {label: SPIDERWEB HUE, address: /td/hue/web}
      saturation: {label: SPIDERWEB SATURATION, address: /td/saturation/web,
                   default: 1.0}       # 0 = black and white, 1 = normal colour
    - label: SIDE AUDIOS + BORIS
      color: side
      hue:        {label: SIDE + BORIS HUE, address: /td/hue/side}
      saturation: {label: SIDE + BORIS SATURATION, address: /td/saturation/side,
                   default: 1.0}
