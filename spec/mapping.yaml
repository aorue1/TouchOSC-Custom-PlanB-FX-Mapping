# ---------------------------------------------------------------------------
# VJ control surface — single source of truth for the TouchOSC layout.
#
# tools/build_tosc.py reads this file and emits build/vj-control.tosc
# (plus build/vj-control.xml, the uncompressed form, for diffing).
#
# Coordinates are in layout pixels. The layout targets a 1024x768 tablet in
# landscape; pages live inside a pager so the top tab bar switches views.
# ---------------------------------------------------------------------------

layout:
  name: PlanB-FX
  tabbar_height: 60
  # iPad Air (4th gen) is 1180x820 points. TouchOSC scales a layout
  # proportionally to the screen, so matching the aspect ratio exactly means no
  # letterboxing in either orientation. One file per orientation: a TouchOSC
  # document has a single fixed size, so a layout cannot reflow on rotation.
  orientations:
    landscape:
      width: 1180
      height: 820
    portrait:
      width: 820
      height: 1180

# TouchOSC connection slots. The connection string in a message is 5 chars,
# one per slot, e.g. "10000" = slot 1 only, "01000" = slot 2 only.
connections:
  resolume:
    slot: 1
    host: 127.0.0.1
    port: 7000          # Arena: Preferences > OSC > Incoming port
    note: Resolume Arena 7 OSC input
  touchdesigner:
    slot: 2
    host: 127.0.0.1
    port: 7001          # TD: OSC In CHOP / OSC In DAT network port
    note: TouchDesigner OSC In

# Palette (r,g,b,a floats 0-1).
# Wordmark shown top-left in the global strip. TouchOSC cannot load images,
# so this is text only.
branding:
  wordmark: PlanB-FX

colors:
  bg:        [0.11, 0.11, 0.13, 1.0]
  panel:     [0.16, 0.16, 0.19, 1.0]
  resolume:  [0.93, 0.35, 0.16, 1.0]
  td:        [0.20, 0.62, 0.90, 1.0]
  accent:    [0.95, 0.80, 0.20, 1.0]
  danger:    [0.85, 0.15, 0.25, 1.0]
  text:      [0.92, 0.92, 0.94, 1.0]
  brand:     [0.90, 0.90, 0.90, 1.0]
  # Master opacity sits beside speed, so it gets its own colour: two identical
  # faders side by side is a good way to grab the wrong one mid-set.
  master:    [0.96, 0.96, 0.98, 1.0]
# FX controls repaint themselves by value, interpolating between these three
# stops. Cool at rest so an idle matrix reads as calm rather than alarming,
# warming through cyan to green as a parameter is brought up.
fx_scale:
  low:  [0.11, 0.28, 0.72, 1.0]     # deep blue, at rest
  mid:  [0.10, 0.78, 0.82, 1.0]     # cyan, halfway
  high: [0.25, 0.95, 0.38, 1.0]     # green, full

# Geometry knobs used by the page builders.
grid:
  layers: 4             # Resolume layers exposed
  clips: 4              # clip rows on screen at once
  banks: 4              # banks per group (second tab row)
  bank_groups: 2        # groups of banks (first tab row)
  clip_height: 64       # height of one clip button
  columns: 6            # column buttons on screen at once
  columns_total: 32     # columns reachable with the < > arrows
  column_row: 56        # height of that row
  bank_tabbar: 34       # height of each of the two bank selector rows
  fx_params: 4          # effects on the FX page
  fx_composition: true  # add a composition-wide column beside the layers
  fx_relative: true     # FX controls move by drag only, so a mistap does nothing
  td_faders: 8          # faders in the TD param bank
  td_pads: 2            # XY pads in the TD param bank
  td_toggles: 8         # toggle buttons in the TD param bank

# ---------------------------------------------------------------------------
# Resolume Arena 7 OSC addresses.
# {layer} and {clip} are 1-based and substituted by the builder.
# ---------------------------------------------------------------------------
resolume:
  clip_connect:   /composition/layers/{layer}/clips/{clip}/connect
  # Fires a whole column across every layer at once.
  column_connect: /composition/columns/{column}/connect
  layer_opacity:  /composition/layers/{layer}/video/opacity
  layer_bypass:   /composition/layers/{layer}/bypassed
  layer_solo:     /composition/layers/{layer}/solo
  layer_clear:    /composition/layers/{layer}/clear
  # CONFIRM THESE in Arena (Shortcuts > Edit OSC, then click the control):
  # the naming follows Resolume's style but is not verified.
  clip_next:      /composition/layers/{layer}/connectnextclip
  clip_prev:      /composition/layers/{layer}/connectpreviousclip
  master:         /composition/master
  speed:          /composition/speed
  tempo_tap:      /composition/tempocontroller/tempotap
  # Tempo as a number. Arena's range is 20-500 BPM; whether it takes the BPM
  # directly or a 0-1 value across that range is UNVERIFIED -- the layout
  # sends the normalised value, which is how Resolume treats most parameters.
  tempo:          /composition/tempocontroller/tempo
  tempo_resync:   /composition/tempocontroller/resync
  # Per-layer effect slots. Add the effect in Arena first, then the parameter
  # index below lines up with its slot order in the layer's effect chain.
  fx_param:       /composition/layers/{layer}/video/effects/{fx}/effect/{param}
  fx_bypass:      /composition/layers/{layer}/video/effects/{fx}/bypassed
  # Same effects at composition level, applied over everything.
  fx_comp_param:  /composition/video/effects/{fx}/effect/{param}
  fx_comp_bypass: /composition/video/effects/{fx}/bypassed
  # Only the effects actually reached for in a set. Each must already exist in
  # the layer's (or composition's) effect chain in Arena -- Resolume addresses
  # effects by name in the chain, so adding them once and saving the
  # composition is what makes these addresses resolve.
  #
  # The fx and param names below follow Resolume's naming style but are
  # UNVERIFIED. Confirm each in Shortcuts > Edit OSC and correct it here.
  fx_names:
    - {name: Hue,       fx: huerotate,  param: rotation}
    - {name: Sat,       fx: saturation, param: saturation}
    - {name: RGB Delay, fx: rgbdelay,   param: delay}
    - {name: Datamosh,  fx: datamosh,   param: amount}

# ---------------------------------------------------------------------------
# TouchDesigner addresses. Flat and predictable so an OSC In CHOP turns them
# straight into channels (touchdesigner/osc_router.py documents the mapping).
# ---------------------------------------------------------------------------
touchdesigner:
  fader:    /td/fader/{n}
  toggle:   /td/toggle/{n}
  pad:      /td/pad/{n}
  trigger:  /td/trigger/{n}
  scene:    /td/scene
  intensity: /td/intensity
  # Defined but unsent: the blackout button lived in the global strip, which
  # is gone. Kept so a panic button can be wired back to it without a
  # round-trip through both hosts' settings.
  blackout: /td/blackout

# BPM field on the master column: tap the number to type one, or nudge it.
tempo:
  min_bpm: 20
  max_bpm: 500
  default_bpm: 128
  nudge: 1

# ---------------------------------------------------------------------------
# Feedback from Resolume into the surface: clip and layer names on the labels
# instead of bare numbers.
#
# This only does anything if Arena is sending: Preferences > OSC > OSC Output,
# enabled, pointing at the iPad's IP on the port TouchOSC receives on.
# Whether Arena publishes names at these addresses is UNVERIFIED -- the
# labels fall back to showing the clip number, so a wrong address costs
# nothing but the feature. Confirm in Shortcuts > Edit OSC.
# ---------------------------------------------------------------------------
feedback:
  enabled: true
  clip_name:  /composition/layers/{layer}/clips/{clip}/name
  layer_name: /composition/layers/{layer}/name

# ---------------------------------------------------------------------------
# Colour pickers. Each picker is an XY pad (hue across, shade up) over three
# RGB faders; the faders carry the OSC, so the pad only has to move them.
#
# The Resolume addresses below are a best guess at a Solid Colour effect's
# parameters. CONFIRM THEM before relying on them: in Arena, Shortcuts > OSC,
# then click the colour parameter to see its real address. Whatever it turns
# out to be, change it here and rebuild.
# ---------------------------------------------------------------------------
colorpicker:
  resolume:
    layer: 1
    red:   /composition/layers/1/video/effects/solidcolor/effect/color/red
    green: /composition/layers/1/video/effects/solidcolor/effect/color/green
    blue:  /composition/layers/1/video/effects/solidcolor/effect/color/blue
  touchdesigner:
    red:   /td/color/r
    green: /td/color/g
    blue:  /td/color/b

# There is no global strip: Resolume is always the master, so its master
# opacity and tempo belong on the Resolume page rather than in a band
# stealing 60pt from every page.
