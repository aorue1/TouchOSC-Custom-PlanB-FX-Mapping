<circle cx="1218.0" cy="93.0" r="14" fill="#ffd23f"/><text x="1218.0" y="99.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">1</text><text x="1242.0" y="98.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Faders</text><text x="1242.0" y="120.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Eight faders on /td/fader/1..8. An OSC</text><text x="1242.0" y="138.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">In CHOP turns these straight into</text><text x="1242.0" y="156.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">channels.</text><circle cx="1218.0" cy="183.0" r="14" fill="#ffd23f"/><text x="1218.0" y="189.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">2</text><text x="1242.0" y="188.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Toggles</text><text x="1242.0" y="210.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Latching, on /td/toggle/1..8.</text><circle cx="1218.0" cy="237.0" r="14" fill="#ffd23f"/><text x="1218.0" y="243.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">3</text><text x="1242.0" y="242.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Triggers</text><text x="1242.0" y="264.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Momentary, on /td/trigger/1..8 —</text><text x="1242.0" y="282.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">one-shots, reloads, bangs.</text><circle cx="1218.0" cy="309.0" r="14" fill="#ffd23f"/><text x="1218.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">4</text><text x="1242.0" y="314.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">XY pads</text><text x="1242.0" y="336.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Two axes each: /td/pad/n/x and</text><text x="1242.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">/td/pad/n/y.</text><circle cx="1218.0" cy="381.0" r="14" fill="#ffd23f"/><text x="1218.0" y="387.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">5</text><text x="1242.0" y="386.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Colour</text><text x="1242.0" y="408.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Opens the same picker as the Resolume</text><text x="1242.0" y="426.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">page, sending to /td/color/r|g|b.</text><circle cx="1218.0" cy="453.0" r="14" fill="#ffd23f"/><text x="1218.0" y="459.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">6</text><text x="1242.0" y="458.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Intensity / scene</text><text x="1242.0" y="480.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Two spare buses for whatever a patch</text><text x="1242.0" y="498.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">needs most.</text>
