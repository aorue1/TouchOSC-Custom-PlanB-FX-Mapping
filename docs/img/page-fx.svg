rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><rect x="428.0" y="420.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><rect x="705.0" y="420.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><rect x="982.0" y="420.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><text x="36.0" y="610.4" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="rgba(237,89,40,1.000)" text-anchor="middle">L4</text><rect x="151.0" y="555.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><rect x="428.0" y="555.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><rect x="705.0" y="555.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><rect x="982.0" y="555.0" width="119.0" height="119.0" rx="2" fill="rgba(28,71,183,1.000)" stroke="rgba(28,71,183,1.000)" stroke-width="1.5"/><text x="36.0" y="745.4" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="rgba(242,204,51,1.000)" text-anchor="middle">COMP</text><rect x="151.0" y="690.0" width="119.0" height="119.0" rx="2" fill="rgba(242,204,51,1.000)" stroke="rgba(242,204,51,1.000)" stroke-width="1.5"/><rect x="428.0" y="690.0" width="119.0" height="119.0" rx="2" fill="rgba(242,204,51,1.000)" stroke="rgba(242,204,51,1.000)" stroke-width="1.5"/><rect x="705.0" y="690.0" width="119.0" height="119.0" rx="2" fill="rgba(242,204,51,1.000)" stroke="rgba(242,204,51,1.000)" stroke-width="1.5"/><rect x="982.0" y="690.0" width="119.0" height="119.0" rx="2" fill="rgba(242,204,51,1.000)" stroke="rgba(242,204,51,1.000)" stroke-width="1.5"/></g>
<rect x="69.0" y="117.0" width="1114.0" height="28.0" fill="none" stroke="#ffd23f" stroke-width="2.5" rx="4" opacity="0.95"/><circle cx="85.0" cy="133.0" r="15" fill="#ffd23f"/><text x="85.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#141416">1</text><rect x="1.5" y="184.0" width="73.5" height="437.0" fill="none" stroke="#ffd23f" stroke-width="2.5" rx="4" opacity="0.95"/><circle cx="17.0" cy="200.0" r="15" fill="#ffd23f"/><text x="17.0" y="206.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#141416">2</text><rect x="1.5" y="724.0" width="73.5" height="32.0" fill="none" stroke="#ffd23f" stroke-width="2.5" rx="4" opacity="0.95"/><circle cx="17.0" cy="740.0" r="15" fill="#ffd23f"/><text x="17.0" y="746.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#141416">3</text><rect x="148.0" y="147.0" width="956.0" height="530.0" fill="none" stroke="#ffd23f" stroke-width="2.5" rx="4" opacity="0.95"/><circle cx="164.0" cy="163.0" r="15" fill="#ffd23f"/><text x="164.0" y="169.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#141416">4</text><rect x="148.0" y="687.0" width="956.0" height="125.0" fill="none" stroke="#ffd23f" stroke-width="2.5" rx="4" opacity="0.95"/><circle cx="164.0" cy="703.0" r="15" fill="#ffd23f"/><text x="164.0" y="709.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#141416">5</text>
<text x="1204.0" y="46.0" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#e8e8ea">FX</text>
<text x="1204.0" y="70.0" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a9a9b2">Four effects across five targets</text>
<circle cx="1218.0" cy="93.0" r="14" fill="#ffd23f"/><text x="1218.0" y="99.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">1</text><text x="1242.0" y="98.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Effects</text><text x="1242.0" y="120.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Only the effects reached for in a set.</text><text x="1242.0" y="138.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">The list is spec-driven: add or remove</text><text x="1242.0" y="156.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">entries in resolume.fx_names.</text><circle cx="1218.0" cy="183.0" r="14" fill="#ffd23f"/><text x="1218.0" y="189.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">2</text><text x="1242.0" y="188.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Layers</text><text x="1242.0" y="210.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">One row per layer.</text><circle cx="1218.0" cy="237.0" r="14" fill="#ffd23f"/><text x="1218.0" y="243.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">3</text><text x="1242.0" y="242.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Composition</text><text x="1242.0" y="264.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">The same effects at composition level,</text><text x="1242.0" y="282.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">over everything.</text><circle cx="1218.0" cy="309.0" r="14" fill="#ffd23f"/><text x="1218.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">4</text><text x="1242.0" y="314.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Dials</text><text x="1242.0" y="336.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Drag to adjust — a tap does nothing, so</text><text x="1242.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">a mistap costs nothing. Dial to zero to</text><text x="1242.0" y="372.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">bypass; there is no separate bypass</text><text x="1242.0" y="390.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">button.</text><circle cx="1218.0" cy="417.0" r="14" fill="#ffd23f"/><text x="1218.0" y="423.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#141416">5</text><text x="1242.0" y="422.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e8e8ea">Colour = value</text><text x="1242.0" y="444.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">Each dial paints itself from its value:</text><text x="1242.0" y="462.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">deep blue at rest, cyan halfway, green</text><text x="1242.0" y="480.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">at full, so the page reads as a level</text><text x="1242.0" y="498.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9a9b2">meter.</text>
</svg>